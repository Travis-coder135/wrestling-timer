<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironman">
<title>Ironman Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #161a20;
    --line: #2a313b;
    --text: #f4f6f8;
    --muted: #9aa4b2;
    --go: #1fbf5a;
    --pause: #f2a516;
    --stop: #e5484d;
    --accent: #4c9dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body.flash { animation: flash 0.5s ease-in-out 3; }
  @keyframes flash { 50% { background: var(--stop); } }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 32px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:disabled { opacity: 0.35; cursor: default; }
  input { font: inherit; -webkit-user-select: text; user-select: text; }

  /* Top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .top .count { color: var(--muted); font-size: 1.05rem; font-weight: 600; }
  .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-weight: 600; }

  /* Timer screen */
  .matchup { text-align: center; margin-top: 8px; }
  .matchup .pair { font-size: clamp(64px, 22vw, 128px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .matchup .pair .vs { font-size: 0.35em; color: var(--muted); font-weight: 700; margin: 0 0.25em; vertical-align: middle; }
  .matchup .iron { color: var(--muted); margin-top: 6px; font-size: 1rem; }
  .situation { margin: 16px 0 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; text-align: center; }
  .situation .label { color: var(--accent); font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .situation .text { font-size: clamp(22px, 7vw, 34px); font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
  .clock { text-align: center; font-size: clamp(88px, 30vw, 180px); font-weight: 800; line-height: 1.05; margin: 12px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .clock.running { color: var(--go); }
  .clock.paused { color: var(--pause); }
  .clock.low { color: var(--stop); }
  .state { text-align: center; color: var(--muted); font-weight: 600; min-height: 1.4em; }
  .main-btn { display: block; width: 100%; margin-top: 14px; min-height: 96px; border-radius: 18px; font-size: 2rem; font-weight: 800; background: var(--go); color: #04210f; }
  .main-btn.pause { background: var(--pause); color: #2a1a00; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .row button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 56px; font-weight: 700; font-size: 1.05rem; }
  .next { margin-top: 16px; color: var(--muted); text-align: center; font-size: 1.05rem; }
  .next b { color: var(--text); }
  .notice { margin-top: 12px; background: #2a2210; border: 1px solid #5c4a17; color: #ffd98a; border-radius: 12px; padding: 10px 14px; font-size: 0.95rem; }
  .done { text-align: center; padding: 48px 0 16px; }
  .done h2 { font-size: 2.4rem; margin: 0 0 8px; }
  .done p { color: var(--muted); margin: 0 0 24px; }

  details.list { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  details.list summary { padding: 14px 16px; font-weight: 700; cursor: pointer; }
  .bouts { list-style: none; margin: 0; padding: 0 8px 8px; }
  .bouts li button { width: 100%; display: grid; grid-template-columns: 2.2em 4.2em 1fr; gap: 8px; align-items: center; text-align: left; background: transparent; padding: 10px 8px; border-radius: 10px; }
  .bouts li button .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bouts li button .p { font-weight: 800; font-variant-numeric: tabular-nums; }
  .bouts li button .s { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bouts li.past button { opacity: 0.45; }
  .bouts li.current button { background: #1d2a3d; outline: 1px solid var(--accent); }
  .bouts li.current button .s { color: var(--text); }

  /* Setup screen */
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
  .card h3 { margin: 0 0 12px; font-size: 1.05rem; }
  .time-in { display: flex; align-items: center; gap: 8px; font-size: 2rem; font-weight: 800; }
  .time-in input { width: 3.2em; text-align: center; font-size: 2rem; font-weight: 800; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; }
  .time-in small { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chips button { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .stepper { display: flex; align-items: center; gap: 16px; }
  .stepper button { width: 52px; height: 52px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 1.6rem; font-weight: 800; }
  .stepper output { font-size: 2rem; font-weight: 800; min-width: 1.5em; text-align: center; }
  .sit { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .sit label { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .sit input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 1.05rem; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 4px 0 0; }
  .primary { display: block; width: 100%; margin-top: 18px; min-height: 64px; border-radius: 14px; background: var(--go); color: #04210f; font-size: 1.3rem; font-weight: 800; }
  .secondary { display: block; width: 100%; margin-top: 10px; min-height: 56px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 1.1rem; font-weight: 700; }
  .order { columns: 2; column-gap: 16px; margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  .order li { padding: 3px 0; break-inside: avoid; color: var(--muted); }
  .order li b { color: var(--text); }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<section id="setup" class="wrap" hidden>
  <h1>Ironman Timer</h1>
  <p class="sub">Set it once. It remembers everything, even if the app closes.</p>

  <div class="card">
    <h3>Bout length</h3>
    <div class="time-in">
      <input id="min" type="number" inputmode="numeric" min="0" max="59" aria-label="Minutes">
      <span>:</span>
      <input id="sec" type="number" inputmode="numeric" min="0" max="59" aria-label="Seconds">
      <small>min : sec</small>
    </div>
    <div class="chips" id="presets"></div>
  </div>

  <div class="card">
    <h3>Wrestlers per group</h3>
    <div class="stepper">
      <button id="wMinus" aria-label="Fewer wrestlers">&minus;</button>
      <output id="wCount">4</output>
      <button id="wPlus" aria-label="More wrestlers">+</button>
    </div>
    <p class="hint" id="wHint"></p>
  </div>

  <div class="card">
    <h3>Situations</h3>
    <div id="sits"></div>
    <p class="hint">Situation 1 is each ironman's first bout, situation 2 their second, and so on.</p>
  </div>

  <div class="card">
    <h3>Bout order</h3>
    <ol class="order" id="order"></ol>
  </div>

  <button class="primary" id="startNew">Start from bout 1</button>
  <button class="secondary" id="backToTimer" hidden>Back to timer</button>
  <button class="secondary" id="testBuzz">Test buzzer</button>
</section>

<!-- TIMER SCREEN -->
<section id="timer" class="wrap" hidden>
  <div class="top">
    <span class="count" id="count"></span>
    <button class="ghost" id="toSetup">Setup</button>
  </div>

  <div id="live">
    <div class="matchup">
      <div class="pair" id="pair"></div>
      <div class="iron" id="iron"></div>
    </div>
    <div class="situation">
      <div class="label" id="sitLabel"></div>
      <div class="text" id="sitText"></div>
    </div>
    <div class="clock" id="clock">0:00</div>
    <div class="state" id="state"></div>
    <button class="main-btn" id="mainBtn">START</button>
    <div class="row">
      <button id="prev">&#9664; Back</button>
      <button id="reset">Reset</button>
      <button id="skip">Skip &#9654;</button>
    </div>
    <div class="next" id="next"></div>
  </div>

  <div class="done" id="doneBox" hidden>
    <h2>Ironman done</h2>
    <p id="doneText"></p>
    <button class="primary" id="again">Run it again</button>
  </div>

  <div class="notice" id="notice" hidden></div>

  <details class="list">
    <summary>All bouts</summary>
    <ul class="bouts" id="bouts"></ul>
  </details>
</section>

<script>
(() => {
  'use strict';

  const KEY_SETTINGS = 'ironman.settings.v1';
  const KEY_RUN = 'ironman.run.v1';
  const PRESETS = [30, 45, 60, 90, 120];

  // ---------- storage ----------
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage off: still works this session */ }
  }

  const saved = load(KEY_SETTINGS) || {};
  const settings = {
    seconds: Number.isFinite(saved.seconds) && saved.seconds > 0 ? saved.seconds : 60,
    wrestlers: Number.isInteger(saved.wrestlers) && saved.wrestlers >= 2 && saved.wrestlers <= 8 ? saved.wrestlers : 4,
    situations: Array.isArray(saved.situations) ? saved.situations.map(String) : []
  };
  // run: { wrestlers, index, phase: 'ready'|'running'|'paused'|'done', endAt, remaining, notice }
  let run = load(KEY_RUN);
  if (!run || !Number.isInteger(run.index) || !Number.isInteger(run.wrestlers)) run = null;

  function saveSettings() { store(KEY_SETTINGS, settings); }
  function saveRun() { store(KEY_RUN, run); }

  // ---------- schedule ----------
  // Each wrestler takes a turn as ironman and faces everyone else in order.
  // With 4: 1v2 1v3 1v4 | 2v3 2v4 2v1 | 3v4 3v1 3v2 | 4v1 4v2 4v3
  function schedule(n) {
    const out = [];
    for (let a = 1; a <= n; a++) {
      for (let k = 1; k < n; k++) {
        out.push({ a, b: ((a - 1 + k) % n) + 1, sit: k - 1 });
      }
    }
    return out;
  }
  function sitText(i) {
    const t = (settings.situations[i] || '').trim();
    return t;
  }
  function sitLine(i) {
    const t = sitText(i);
    return 'Situation ' + (i + 1) + (t ? ': ' + t : '');
  }

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function fullMs() { return settings.seconds * 1000; }
  function timeOfDay(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  // ---------- sound + vibration ----------
  let ctx = null;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freqs, start, dur, vol) {
    const c = audio();
    if (!c) return;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.setValueAtTime(vol, start + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    g.connect(c.destination);
    freqs.forEach((f) => {
      const o = c.createOscillator();
      o.type = 'square';
      o.frequency.value = f;
      o.connect(g);
      o.start(start);
      o.stop(start + dur + 0.02);
    });
  }
  function buzzer() {
    const c = audio();
    if (c) tone([220, 277], c.currentTime + 0.01, 1.4, 0.35);
    if (navigator.vibrate) navigator.vibrate([500, 150, 500]);
    document.body.classList.remove('flash');
    void document.body.offsetWidth;
    document.body.classList.add('flash');
  }
  function chirp() {
    const c = audio();
    if (c) tone([880], c.currentTime + 0.01, 0.12, 0.25);
  }

  // ---------- keep screen awake ----------
  let lock = null;
  async function keepAwake(on) {
    try {
      if (on && !lock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      } else if (!on && lock) {
        await lock.release();
        lock = null;
      }
    } catch (e) { lock = null; }
  }

  // ---------- run control ----------
  function bouts() { return schedule(run.wrestlers); }

  function setReady(index) {
    const list = bouts();
    if (index >= list.length) {
      run.index = list.length;
      run.phase = 'done';
    } else {
      run.index = Math.max(0, index);
      run.phase = 'ready';
    }
    run.endAt = null;
    run.remaining = fullMs();
    saveRun();
  }

  function finishBout(whileAway) {
    const list = bouts();
    const ended = list[run.index];
    const endedAt = run.endAt;
    setReady(run.index + 1);
    if (whileAway && ended) {
      run.notice = 'Bout ' + (list.indexOf(ended) + 1) + ' (' + ended.a + ' vs ' + ended.b + ') ended at ' +
        timeOfDay(endedAt) + ' while the app was closed.';
      saveRun();
    } else {
      buzzer();
    }
  }

  function start() {
    audio(); // unlock sound on this tap
    chirp();
    run.notice = null;
    if (run.phase === 'paused') {
      run.endAt = Date.now() + run.remaining;
    } else {
      run.endAt = Date.now() + fullMs();
    }
    run.phase = 'running';
    saveRun();
    render();
  }
  function pause() {
    run.remaining = Math.max(0, run.endAt - Date.now());
    run.endAt = null;
    run.phase = 'paused';
    saveRun();
    render();
  }

  function newRun() {
    run = { wrestlers: settings.wrestlers, index: 0, phase: 'ready', endAt: null, remaining: fullMs(), notice: null };
    saveRun();
  }

  // Called on load and whenever the app comes back into view.
  function catchUp(whileAway) {
    if (run && run.phase === 'running' && Date.now() >= run.endAt) finishBout(whileAway);
  }

  // ---------- screens ----------
  function showSetup() {
    $('timer').hidden = true;
    $('setup').hidden = false;
    keepAwake(false);
    renderTimeInputs();
    renderSetup();
    window.scrollTo(0, 0);
  }
  function showTimer() {
    $('setup').hidden = true;
    $('timer').hidden = false;
    keepAwake(true);
    render();
    window.scrollTo(0, 0);
  }

  // ---------- setup screen ----------
  function syncSituations() {
    const need = settings.wrestlers - 1;
    while (settings.situations.length < need) settings.situations.push('');
  }
  function renderTimeInputs() {
    $('min').value = Math.floor(settings.seconds / 60);
    $('sec').value = String(settings.seconds % 60).padStart(2, '0');
  }
  function renderSetup() {
    syncSituations();
    renderPresets();
    $('wCount').textContent = settings.wrestlers;
    renderRest();
  }
  function renderPresets() {
    const presets = $('presets');
    presets.textContent = '';
    PRESETS.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = fmt(s * 1000);
      if (s === settings.seconds) b.className = 'on';
      b.addEventListener('click', () => { settings.seconds = s; saveSettings(); renderTimeInputs(); renderPresets(); });
      presets.appendChild(b);
    });
  }
  function renderRest() {
    $('wMinus').disabled = settings.wrestlers <= 2;
    $('wPlus').disabled = settings.wrestlers >= 8;
    const total = settings.wrestlers * (settings.wrestlers - 1);
    $('wHint').textContent = total + ' bouts. Each wrestler is the ironman for ' + (settings.wrestlers - 1) + ' in a row.';

    const sits = $('sits');
    // Rebuild only when the count changes, so typing keeps focus.
    if (sits.children.length !== settings.wrestlers - 1) {
      sits.textContent = '';
      for (let i = 0; i < settings.wrestlers - 1; i++) {
        const row = document.createElement('div');
        row.className = 'sit';
        const label = document.createElement('label');
        label.htmlFor = 'sit' + i;
        label.textContent = 'Situation ' + (i + 1);
        const input = document.createElement('input');
        input.id = 'sit' + i;
        input.type = 'text';
        input.placeholder = ['e.g. Neutral', 'e.g. Ironman on top', 'e.g. Ironman on bottom'][i] || 'Describe it';
        input.value = settings.situations[i] || '';
        input.addEventListener('input', () => {
          settings.situations[i] = input.value;
          saveSettings();
          renderOrder();
        });
        row.appendChild(label);
        row.appendChild(input);
        sits.appendChild(row);
      }
    }
    renderOrder();

    const resumable = run && run.phase !== 'done' && run.wrestlers === settings.wrestlers;
    $('backToTimer').hidden = !resumable;
    $('startNew').textContent = resumable ? 'Restart from bout 1' : 'Start from bout 1';
  }
  function renderOrder() {
    const order = $('order');
    order.textContent = '';
    schedule(settings.wrestlers).forEach((m) => {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = m.a + ' v ' + m.b;
      li.appendChild(b);
      li.appendChild(document.createTextNode('  ' + (sitText(m.sit) || 'Situation ' + (m.sit + 1))));
      order.appendChild(li);
    });
  }

  function readTime() {
    const m = Math.min(59, Math.max(0, parseInt($('min').value, 10) || 0));
    const s = Math.min(59, Math.max(0, parseInt($('sec').value, 10) || 0));
    const total = m * 60 + s;
    if (total > 0) settings.seconds = total;
    saveSettings();
  }
  $('min').addEventListener('input', () => { readTime(); renderPresets(); });
  $('sec').addEventListener('input', () => { readTime(); renderPresets(); });
  $('wMinus').addEventListener('click', () => { settings.wrestlers = Math.max(2, settings.wrestlers - 1); saveSettings(); renderSetup(); });
  $('wPlus').addEventListener('click', () => { settings.wrestlers = Math.min(8, settings.wrestlers + 1); saveSettings(); renderSetup(); });
  $('startNew').addEventListener('click', () => {
    readTime();
    if (!(parseInt($('min').value, 10) > 0 || parseInt($('sec').value, 10) > 0)) {
      alert('Set a bout length longer than 0:00.');
      return;
    }
    if (run && run.phase === 'running' && !confirm('A bout is running. Restart from bout 1?')) return;
    audio();
    newRun();
    showTimer();
  });
  $('backToTimer').addEventListener('click', () => {
    readTime();
    if (run.phase === 'ready') { run.remaining = fullMs(); saveRun(); }
    showTimer();
  });
  $('testBuzz').addEventListener('click', buzzer);

  // ---------- timer screen ----------
  function render() {
    if (!run || $('timer').hidden) return;
    const list = bouts();
    const done = run.phase === 'done';
    $('live').hidden = done;
    $('doneBox').hidden = !done;
    $('count').textContent = done ? 'All ' + list.length + ' bouts done' : 'Bout ' + (run.index + 1) + ' of ' + list.length;

    if (done) {
      $('doneText').textContent = list.length + ' bouts, ' + run.wrestlers + ' wrestlers.';
    } else {
      const m = list[run.index];
      $('pair').innerHTML = '';
      $('pair').append(String(m.a));
      const vs = document.createElement('span');
      vs.className = 'vs';
      vs.textContent = 'vs';
      $('pair').append(vs, String(m.b));
      $('iron').textContent = 'Ironman ' + m.a + ' · bout ' + (m.sit + 1) + ' of ' + (run.wrestlers - 1);
      $('sitLabel').textContent = 'Situation ' + (m.sit + 1);
      $('sitText').textContent = sitText(m.sit) || '—';

      const remaining = run.phase === 'running' ? run.endAt - Date.now() : run.remaining;
      const clock = $('clock');
      clock.textContent = fmt(remaining);
      clock.className = 'clock' + (run.phase === 'running' ? (remaining <= 10000 ? ' low' : ' running') : run.phase === 'paused' ? ' paused' : '');

      const btn = $('mainBtn');
      if (run.phase === 'running') { btn.textContent = 'PAUSE'; btn.className = 'main-btn pause'; }
      else if (run.phase === 'paused') { btn.textContent = 'RESUME'; btn.className = 'main-btn'; }
      else { btn.textContent = 'START'; btn.className = 'main-btn'; }

      $('state').textContent = run.phase === 'running' ? 'Wrestling' : run.phase === 'paused' ? 'Paused' : 'Ready — tap Start';

      const locked = run.phase === 'running';
      $('prev').disabled = locked || run.index === 0;
      $('reset').disabled = locked || (run.phase === 'ready' && run.remaining === fullMs());
      $('skip').disabled = locked;

      const n = list[run.index + 1];
      const next = $('next');
      next.textContent = '';
      if (n) {
        next.append('Up next: ');
        const b = document.createElement('b');
        b.textContent = n.a + ' vs ' + n.b;
        next.append(b, ' · ' + sitLine(n.sit));
      } else {
        next.textContent = 'Last bout';
      }
    }

    const notice = $('notice');
    notice.hidden = !run.notice;
    notice.textContent = run.notice || '';

    renderBouts(list);
  }

  let boutsKey = '';
  function renderBouts(list) {
    const key = run.index + '|' + run.phase + '|' + run.wrestlers + '|' + settings.situations.join('\u0001');
    if (key === boutsKey) return;
    boutsKey = key;
    const ul = $('bouts');
    ul.textContent = '';
    list.forEach((m, i) => {
      const li = document.createElement('li');
      li.className = i < run.index ? 'past' : i === run.index ? 'current' : '';
      const b = document.createElement('button');
      b.disabled = run.phase === 'running' && i !== run.index;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
      const p = document.createElement('span'); p.className = 'p'; p.textContent = m.a + ' v ' + m.b;
      const s = document.createElement('span'); s.className = 's'; s.textContent = sitLine(m.sit);
      b.append(n, p, s);
      b.addEventListener('click', () => {
        if (run.phase === 'running' || i === run.index) return;
        run.notice = null;
        setReady(i);
        render();
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  $('mainBtn').addEventListener('click', () => {
    if (run.phase === 'running') pause(); else start();
  });
  $('prev').addEventListener('click', () => { run.notice = null; setReady(run.index - 1); render(); });
  $('skip').addEventListener('click', () => { run.notice = null; setReady(run.index + 1); render(); });
  $('reset').addEventListener('click', () => { run.notice = null; setReady(run.index); render(); });
  $('again').addEventListener('click', () => { run.notice = null; setReady(0); render(); });
  $('toSetup').addEventListener('click', () => {
    if (run.phase === 'running') pause();
    showSetup();
  });

  // ---------- loop ----------
  setInterval(() => {
    if (!run || run.phase !== 'running') return;
    if (Date.now() >= run.endAt) {
      finishBout(document.visibilityState !== 'visible');
    }
    render();
  }, 100);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      catchUp(true);
      if (!$('timer').hidden) { keepAwake(true); render(); }
    }
  });

  // ---------- boot ----------
  catchUp(true);
  if (run && run.phase !== 'done' && run.wrestlers === settings.wrestlers) showTimer();
  else showSetup();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
